# DoubleML Coverage Theme Configuration
# Central color palette and styling settings
# Color scheme inspired by DoubleML brand colors (professional blues)

coverage_colors:
  good:
    background: "#d4edda"
    text: "#155724"
    border: "#28a745"
    description: "Good"
  medium:
    background: "#fff8e6"
    text: "#7a5e00"
    border: "#d4a800"
    description: "Moderate"
  poor:
    background: "#fdeef0"
    text: "#7d2e3a"
    border: "#c94a5a"
    description: "Poor"

table_styling:
  header_bg: "linear-gradient(135deg, #003d5c 0%, #0088cc 100%)"
  header_text: "#ffffff"
  border: "#dee5ea"
  caption_color: "#1e3a4c"
  hover_bg: "rgba(0, 136, 204, 0.06)"
  row_bg_even: "#ffffff"
  row_bg_odd: "#f7f9fb"

coverage_thresholds:
  good: 0.05 # Within 5% of nominal level
  medium: 0.1 # Within 10% of nominal level
  poor: 1.0 # Beyond 10% of nominal level
